name: Test, build and release
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy pillow scipy openpyxl
      - run: node scripts/test-ci.mjs
      - run: npm run build
      - run: node scripts/package-release.mjs web x64
      - uses: actions/upload-artifact@v4
        with:
          name: Web-offline
          path: release/*.zip
  mac:
    needs: test
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test native/tests/*.test.cjs
      - run: npm run build:mac
        env:
          BLOTSTUDIO_MAC_ARCH: ${{ matrix.arch }}
      - run: node scripts/package-release.mjs mac ${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: macOS-${{ matrix.arch }}
          path: release/*.zip
  windows:
    needs: test
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: npm run build
      - run: node --test tests/windows-save.test.cjs
      - run: dotnet publish native/windows/BlotStudio.csproj -c Release -r win-${{ matrix.arch }} --self-contained true -o dist/windows-${{ matrix.arch }}
      - run: node scripts/package-release.mjs windows ${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: Windows-${{ matrix.arch }}
          path: release/*.zip
  publish:
    needs: [test, mac, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Checksums and source archive
        run: |
          git archive --format=zip --prefix=BlotStudio-source/ HEAD -o release-assets/BlotStudio-source-v0.4.0.zip
          cd release-assets
          sha256sum *.zip > SHA256SUMS.txt
      - name: Publish verified builds as preview
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=v0.4.0-preview.${{ github.run_number }}
          gh release create "$tag" release-assets/* --target "$GITHUB_SHA" --title "BlotStudio v0.4.0 Preview" --prerelease --notes-file RELEASE-NOTES.md
